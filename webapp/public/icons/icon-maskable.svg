<!--
  FairShare maskable icon. Full-bleed green background — the OS adds
  its own shape mask (circle / squircle / rounded square). Foreground
  vector stays inside the 10%–90% safe zone so nothing important gets
  clipped, even by the most aggressive launcher masks.
-->
