plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.fairshare.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fairshare.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (project.hasProperty('FAIRSHARE_KEYSTORE')) {
                storeFile file(project.property('FAIRSHARE_KEYSTORE'))
                storePassword project.property('FAIRSHARE_KEYSTORE_PASSWORD')
                keyAlias project.property('FAIRSHARE_KEY_ALIAS')
                keyPassword project.property('FAIRSHARE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('FAIRSHARE_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
