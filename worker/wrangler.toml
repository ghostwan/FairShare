name = "fairshare-sync"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "fairshare-sync-db"
database_id = "eac66b52-6aa3-4049-9e2d-feade97452b2"

[vars]
# Maximum number of operations returned by a single GET /ops?since= page.
PULL_PAGE_SIZE = "500"
# Maximum bytes accepted in a single POST /ops body. Worker request bodies are
# already capped at 100 MB by Cloudflare; this is the app-level guardrail.
MAX_PUSH_BYTES = "1048576"
# VAPID public key (base64url, 65-byte uncompressed P-256 point) returned
# by `GET /web-push/key` so browsers can pass it to
# `pushManager.subscribe({ applicationServerKey })`. Pair with the
# matching VAPID_PRIVATE_KEY secret (see worker/scripts/generate-vapid.mjs
# for how this was generated). Rotate both at the same time — they're a
# keypair.
VAPID_PUBLIC_KEY = "BMfFfYHkP-y_7qtQcwfQoWpDE7XEKlDJaRieGwcsm_PmVgYzqxQZsjmELPzUvN-dbjfER9MhJ6vCjA2lj83oX1o"
# RFC 8292 `sub` claim of the VAPID JWT — push services contact this
# address (or open this URL) if our keys ever get flagged for abuse.
VAPID_SUBJECT = "mailto:ghostwan@gmail.com"
